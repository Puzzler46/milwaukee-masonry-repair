name: Import original project photos
on:
  push:
    paths:
      - '.github/workflows/import-project-photos.yml'
      - 'tools/import_masonry_photos.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import-project-photos:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image import dependencies
        run: python -m pip install --disable-pip-version-check requests Pillow
      - name: Download actual project photos from original company website
        run: python tools/import_masonry_photos.py
      - name: Commit downloaded photos into repository
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/projects/
          if ! git diff --cached --quiet; then
            git commit -m 'Import original company project photos into GitHub assets'
            git push
          fi